<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Problem — Smart Interview Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body data-page="problems">
  <div id="app-navbar"></div>

  <main class="container page">
    <div class="page-header">
      <div>
        <h1>Add a Problem</h1>
        <p>Log a problem you've attempted or want to revisit.</p>
      </div>
      <a class="btn btn-outline" href="problems.html">&larr; Back to list</a>
    </div>

    <form class="form-card" id="add-form" style="max-width:560px" novalidate>
      <div class="form-error hidden" id="add-error"></div>

      <div class="form-group">
        <label for="title">Problem title</label>
        <input class="input" type="text" id="title" required placeholder="Two Sum" />
      </div>

      <div class="form-group">
        <label for="topic">Topic</label>
        <input class="input" type="text" id="topic" required placeholder="Arrays / DP / Graphs / …" list="topic-list" />
        <datalist id="topic-list">
          <option value="Arrays"></option>
          <option value="Strings"></option>
          <option value="Linked List"></option>
          <option value="Stack"></option>
          <option value="Queue"></option>
          <option value="Hashing"></option>
          <option value="Recursion"></option>
          <option value="Binary Search"></option>
          <option value="Trees"></option>
          <option value="Graphs"></option>
          <option value="Dynamic Programming"></option>
          <option value="Greedy"></option>
          <option value="Bit Manipulation"></option>
        </datalist>
      </div>

      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <select class="select" id="difficulty" required>
          <option value="">Select difficulty</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select class="select" id="status" required>
          <option value="Unsolved">Unsolved</option>
          <option value="Solved">Solved</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="add-btn">Save problem</button>
    </form>
  </main>

  <div id="app-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/add-problem.js"></script>
</body>
</html>
